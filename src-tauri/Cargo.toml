[package]
name = "dalaran-browser"
version = "0.1.0"
description = "Navegador web de lectura profunda, síntesis y captura activa de conocimiento"
edition = "2021"

[lib]
name = "dalaran_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
keyring = "3"
tokio = { version = "1", features = ["net", "time", "io-util"] }
